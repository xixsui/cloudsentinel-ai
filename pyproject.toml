[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsentinel-ai"
version = "0.9.1"
description = "AWS CSPM with Python security engine and local Next.js/FastAPI migration preview"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"
dependencies = [
    "pydantic>=2.0.0", "python-dotenv>=1.0.0", "requests>=2.32.0",
    "keyring>=25.0.0", "streamlit>=1.38.0", "pandas>=2.0.0",
    "plotly>=5.20.0", "schedule>=1.2.0", "boto3>=1.34.0",
    "anthropic>=0.40.0", "openai>=1.50.0", "google-genai>=0.3.0",
    "groq>=0.11.0", "cryptography>=43.0.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0"]
dev = ["pytest>=8.0", "ruff>=0.8.0", "bandit>=1.8.0", "pip-audit>=2.7.0"]

[tool.setuptools.packages.find]
include = ["backend_api*", "cloud_connection*", "ai_module*", "config*", "dashboard*", "mock_data*", "orchestrator*", "prowler_module*", "siem_module*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
